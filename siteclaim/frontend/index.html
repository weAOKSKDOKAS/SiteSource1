    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Atlas design system: Bricolage Grotesque (display), Spline Sans (body),
         Spline Sans Mono (codes/refs/citations). Graceful system-font fallback offline. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- client_boq (the tender-review product, #/tender): Libre Franklin (interface),
         Source Serif 4 (the argument — rationale, clause text, scope prose), IBM Plex Mono
         (ids, counts, page refs — anything machine-produced or compared digit by digit).
         A separate family set because it is a separate product with its own visual identity;
         the files only download once a page actually renders those glyphs.
         TODO: self-host both sets before production. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
